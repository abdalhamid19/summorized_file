<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Selectors Assignment 04</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font: inherit; }
    body { width: 262px; height: 845px; overflow: hidden; padding: 38px 0 0 49px; background: #fff; color: #000; font: normal 40px/55px "Times New Roman", serif; }
    body > div[title]:not(.no-need) { color: #f00; font-weight: 700; }
  </style>
</head>
<body>
<p>Testing</p>
<div>Testing</div>
<div>Testing</div>
<div title="Elzero">Elzero</div>
<div title="Hello">Elzero</div>
<div title="HTML">Elzero</div>
<div>Testing</div>
<div class="no-need" title="Elzero">Testing</div>
<div class="parent">
  <div>Testing</div>
  <p>Testing</p>
  <div>Testing</div>
  <div title="Elzero">Testing</div>
  <div>Testing</div>
  <div title="Elzero">Testing</div>
</div>
</body>
</html>
