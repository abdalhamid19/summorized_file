<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Selectors Assignment 03</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font: inherit; }
    body { width: 252px; height: 396px; overflow: hidden; padding: 34px 0 0 45px; background: #fff; color: #000; font: normal 40px/55px "Times New Roman", serif; }
    .parent > .baby:only-child { color: #f00; font-weight: 700; }
  </style>
</head>
<body>
<div class="parent">
  <div class="baby">Testing</div>
  <div class="baby">Testing</div>
</div>
<div class="parent">
  <div class="baby">Elzero</div>
</div>
<div class="parent">

    <div>Testing</div>
  </div>
  <div class="baby">Testing</div>
</div>
<div class="baby">Testing</div>
</body>
</html>
