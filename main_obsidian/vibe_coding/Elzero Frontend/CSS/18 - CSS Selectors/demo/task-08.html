<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Selectors Assignment 08</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font: inherit; }
    body { width: 213px; height: 458px; overflow: hidden; padding: 38px 0 0 30px; background: #fff; color: #000; font: normal 40px/55px "Times New Roman", serif; }
    div:not(:first-child):not(:last-child), p:not(:first-child):not(:last-child) { color: #f00; font-weight: 700; }
  </style>
</head>
<body>
<div>
  <div>Testing</div>
  <div>Elzero</div>
  <div>Elzero</div>
  <h3>Testing</h3>
  <p>Elzero</p>
  <h3>Testing</h3>
  <div>Testing</div>
</div>
</body>
</html>
