<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تكليف أحجام الخط بوحدة rem</title>
  <style>
    html { font-size: 20px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #f2f5f9; color: #1e293b; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    main { max-width: 900px; margin: auto; padding: 24px; border: 1px solid #dbe3ee; border-radius: 14px; background: white; box-shadow: 0 10px 28px rgb(15 23 42 / 6%); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 12px; color: #64748b; }
    .sample { margin: 10px 0; padding: 8px 14px; border-right: 4px solid #147d73; border-radius: 6px; background: #edf8f6; direction: ltr; text-align: left; color: #1e293b; }
    .first { font-size: 2.5rem; }
    .second { font-size: 2rem; }
    .third { font-size: 1.5rem; }
    pre { overflow: auto; margin: 18px 0 0; padding: 14px; border-radius: 8px; background: #1e293b; color: #e2e8f0; direction: ltr; text-align: left; font: 13px/1.6 Consolas, monospace; }
  </style>
</head>
<body>
  <main id="task-03">
    <h1>Root Font Size and rem</h1>
    <p>حجم الجذر 20px؛ وكل عينة تعرض قيمة rem المطلوبة وحجمها الناتج.</p>
    <div class="sample first">50px = 2.5rem</div>
    <div class="sample second">40px = 2rem</div>
    <div class="sample third">30px = 1.5rem</div>
    <pre>html { font-size: 20px; }
.first  { font-size: 2.5rem; }
.second { font-size: 2rem; }
.third  { font-size: 1.5rem; }</pre>
  </main>
</body>
</html>
