<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Transform Scale Rotate Translate 65-67</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;font:18px Arial,sans-serif}.task{position:relative;height:300px;display:grid;place-items:center;border-bottom:1px solid #ddd}.task h2{position:absolute;left:30px;top:8px;font-size:18px;color:#333}.stage{width:100%;min-height:250px;display:grid;place-items:center}.card{position:relative;width:300px;height:200px;display:grid;place-items:center;background:#eee;color:#03a9f4;font:bold 34px Georgia,serif;}.card::before,.card::after{content:"";position:absolute;inset:0;z-index:-1}.card::before{background:#e91e63;transform:rotate(6deg)}.card::after{background:#03a9f4;transform:rotate(-6deg)}.ring{position:relative;width:200px;height:200px;display:grid;place-items:center;border-radius:50%;background:#eee;color:#111;font:bold 18px Georgia,serif}.ring::before,.ring::after{content:"";position:absolute;border-radius:50%;mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}.ring::before{inset:-5px;background:conic-gradient(from 10deg,#2196f3 0deg 300deg,transparent 300deg 360deg)}.ring::after{inset:3px;background:conic-gradient(from 110deg,#e91e63 0deg 300deg,transparent 300deg 360deg)}.ring::before,.ring::after{transition:transform .5s}.task:nth-of-type(3) .ring:hover::before{transform:rotate(360deg)}.task:nth-of-type(3) .ring:hover::after{transform:rotate(-360deg)}</style></head><body><section class="task"><h2>Task 01</h2><div class="stage"><div class="card">Elzero</div></div></section><section class="task"><h2>Task 02</h2><div class="stage"><div class="ring">Elzero</div></div></section><section class="task"><h2>Task 03 — hover to rotate</h2><div class="stage"><div class="ring">Elzero</div></div></section></body></html>
