<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Transform Skew Matrix 3D 68-73</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;font:18px Arial,sans-serif}.task{min-height:300px;display:grid;place-items:center;border-bottom:1px solid #ddd;position:relative}.task h2{position:absolute;left:30px;top:8px;font-size:18px}.stage{width:100%;display:grid;place-items:center;min-height:260px}section.task:nth-of-type(4) .stage{min-height:520px}.shape{--main-color:#ff5722;width:150px;height:140px;background:var(--main-color);clip-path:polygon(0 0,50% 13%,100% 0,91% 50%,100% 100%,50% 87%,0 100%,9% 50%);display:grid;place-items:center;color:white;font:bold 40px Georgia,serif}.banner{position:relative;width:300px;height:140px;background:#009688;transform:skewX(20deg);display:grid;place-items:center;color:white;font:bold 44px Georgia,serif}.banner::before{content:"";position:absolute;left:22px;top:0;width:12px;height:100%;background:white}.banner span{display:block;transform:skewX(-20deg);margin-left:50px}.card{position:relative;width:200px;height:200px;background:#607d8b;color:white;display:flex;align-items:flex-end;padding:8px;perspective:600px}.card::before{content:"";position:absolute;width:200px;height:200px;left:0;top:-100px;z-index:1;background:#000;border:2px solid white;transform:rotate(45deg)}.flip-wrap{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}.flip-card{width:200px;height:200px;perspective:700px}.flip-card__inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s}.flip-card:hover .flip-card__inner{transform:rotateY(180deg)}.flip-card--vertical:hover .flip-card__inner{transform:rotateX(180deg)}.flip-card__face{position:absolute;inset:0;display:grid;place-items:center;background:#e91e63;color:white;font:32px Arial,sans-serif;backface-visibility:hidden}.flip-card__back{background:#009688;transform:rotateY(180deg)}.flip-card--vertical .flip-card__back{transform:rotateX(180deg)}</style></head><body><section class="task"><h2>Task 01</h2><div class="stage"><div class="shape">Elzero</div></div></section><section class="task"><h2>Task 02</h2><div class="stage"><div class="banner"><span>Elzero</span></div></div></section><section class="task"><h2>Task 03</h2><div class="stage"><pre>transform: skewX(20deg);
transform: skewX(-20deg);</pre></div></section><section class="task"><h2>Task 04</h2><div class="stage"><div class="card">Elzero</div></div></section><section class="task"><h2>Task 05 — hover to flip</h2><div class="stage"><div class="flip-wrap"><div class="flip-card"><div class="flip-card__inner"><div class="flip-card__face">Front</div><div class="flip-card__face flip-card__back">Back</div></div></div><div class="flip-card flip-card--vertical"><div class="flip-card__inner"><div class="flip-card__face">Front</div><div class="flip-card__face flip-card__back">Back</div></div></div></div></div></section></body></html>
